[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-listing-reviewer"
version = "0.1.0"
description = "Flag stale resale listings by age and cart rate, suggest price-drop ladders and re-list dates, and print a review worksheet sorted by holding cost."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["reselling", "ebay", "poshmark", "marketplace", "lister", "llm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
stale-listing-reviewer = "stale_listing_reviewer.cli:main"

[project.urls]
Homepage = "https://dylanasdale.github.io"

[tool.setuptools.packages.find]
include = ["stale_listing_reviewer*"]
